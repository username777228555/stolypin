name: Media (Wikimedia images)

# Downloads illustrations for content packs from Wikimedia Commons (with author, date and licence),
# crops portraits around faces and commits the images back to the branch. Run it manually or push a commit
# with «[media]» in its message to main or a gumball/** / media/** branch. Script: scripts/media/wiki_images.py.
# «[gubernii]» in the message (or task=gubernii) fetches only the 1856 governorate cards: scripts/media/gubernii_1856.py.
on:
  workflow_dispatch:
    inputs:
      task:
        description: 'images — illustrations for all content; gubernii — only the 1856 governorate card set'
        default: images
  push:
    branches: [main, 'gumball/**', 'media/**']

permissions:
  contents: write

concurrency:
  group: media-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[media]') || contains(github.event.head_commit.message, '[gubernii]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: pip install requests pillow opencv-python-headless

      - name: Fetch images from Wikimedia Commons
        if: ${{ !(inputs.task == 'gubernii' || contains(github.event.head_commit.message, '[gubernii]')) }}
        run: python3 scripts/media/wiki_images.py fetch

      - name: Governorate card set 1856 («Губернии 1856»)
        if: (inputs.task == 'gubernii' || contains(github.event.head_commit.message, '[gubernii]'))
        run: python3 scripts/media/gubernii_1856.py

      - name: Apply to content and clean up
        if: ${{ !(inputs.task == 'gubernii' || contains(github.event.head_commit.message, '[gubernii]')) }}
        run: |
          python3 scripts/media/wiki_images.py apply
          python3 scripts/media/wiki_images.py gc

      - name: Commit images
        run: |
          git config user.name "stolypin-media-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A content
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
          git commit -m "Иллюстрации с Wikimedia Commons: портреты, события, живопись (scripts/media)"
          # The run takes minutes; main may have moved meanwhile — rebase onto it and retry.
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase origin "${GITHUB_REF_NAME}" || exit 1
          done
          exit 1
