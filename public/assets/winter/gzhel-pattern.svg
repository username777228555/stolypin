<svg xmlns="http://www.w3.org/2000/svg" width="280" height="280" viewBox="0 0 280 280">
  <defs>
    <!-- Вырез веерных белых штрихов кисти и спирали для главного цветка Гжели (работает и на белом, и на тёмном!) -->
    <mask id="gz-flower-cut" maskUnits="userSpaceOnUse" x="-48" y="-48" width="96" height="96">
      <rect x="-48" y="-48" width="96" height="96" fill="#ffffff" />
      <g stroke="#000000" stroke-linecap="round" fill="none">
        <path d="M0,-9 L0,-27 M-3.2,-9 L-8.5,-25 M3.2,-9 L8.5,-25 M-6.5,-8 L-14,-20 M6.5,-8 L14,-20 M-9.5,-6 L-17,-14 M9.5,-6 L17,-14" stroke-width="1.3" />
        <g transform="rotate(72)">
          <path d="M0,-9 L0,-27 M-3.2,-9 L-8.5,-25 M3.2,-9 L8.5,-25 M-6.5,-8 L-14,-20 M6.5,-8 L14,-20 M-9.5,-6 L-17,-14 M9.5,-6 L17,-14" stroke-width="1.3" />
        </g>
        <g transform="rotate(144)">
          <path d="M0,-9 L0,-27 M-3.2,-9 L-8.5,-25 M3.2,-9 L8.5,-25 M-6.5,-8 L-14,-20 M6.5,-8 L14,-20 M-9.5,-6 L-17,-14 M9.5,-6 L17,-14" stroke-width="1.3" />
        </g>
        <g transform="rotate(216)">
          <path d="M0,-9 L0,-27 M-3.2,-9 L-8.5,-25 M3.2,-9 L8.5,-25 M-6.5,-8 L-14,-20 M6.5,-8 L14,-20 M-9.5,-6 L-17,-14 M9.5,-6 L17,-14" stroke-width="1.3" />
        </g>
        <g transform="rotate(288)">
          <path d="M0,-9 L0,-27 M-3.2,-9 L-8.5,-25 M3.2,-9 L8.5,-25 M-6.5,-8 L-14,-20 M6.5,-8 L14,-20 M-9.5,-6 L-17,-14 M9.5,-6 L17,-14" stroke-width="1.3" />
        </g>
      </g>
      <circle cx="0" cy="0" r="9.2" fill="#000000" />
    </mask>

    <!-- Вырез прожилок для плоского гжельского листа -->
    <mask id="gz-leaf-cut" maskUnits="userSpaceOnUse" x="-18" y="-36" width="36" height="40">
      <rect x="-18" y="-36" width="36" height="40" fill="#ffffff" />
      <path d="M0,-2 L0,-26 M0,-9 L-7,-16 M0,-9 L7,-16 M0,-17 L-5,-22 M0,-17 L5,-22" stroke="#000000" stroke-width="1.5" stroke-linecap="round" fill="none" />
    </mask>

    <!-- Пышный плоский 2D цветок Гжели (как на графическом образце №2) -->
    <g id="gz-blossom">
      <g mask="url(#gz-flower-cut)" fill="#1d469e">
        <path d="M0,-7 C-12,-15 -18,-31 -8,-39 C-3,-42 3,-42 8,-39 C18,-31 12,-15 0,-7 Z" />
        <path d="M0,-7 C-12,-15 -18,-31 -8,-39 C-3,-42 3,-42 8,-39 C18,-31 12,-15 0,-7 Z" transform="rotate(72)" />
        <path d="M0,-7 C-12,-15 -18,-31 -8,-39 C-3,-42 3,-42 8,-39 C18,-31 12,-15 0,-7 Z" transform="rotate(144)" />
        <path d="M0,-7 C-12,-15 -18,-31 -8,-39 C-3,-42 3,-42 8,-39 C18,-31 12,-15 0,-7 Z" transform="rotate(216)" />
        <path d="M0,-7 C-12,-15 -18,-31 -8,-39 C-3,-42 3,-42 8,-39 C18,-31 12,-15 0,-7 Z" transform="rotate(288)" />
      </g>
      <path d="M0,-5.2 C3.8,-5.2 5.8,-2.2 5,1.4 C4.2,4.4 1.2,5.8 -2,4.8 C-4.4,4 -5,1.2 -3.6,-1.2 C-2.4,-2.8 0,-2.8 1.2,-1.6" fill="none" stroke="#1d469e" stroke-width="1.65" stroke-linecap="round" />
      <circle cx="0.2" cy="0.2" r="1.8" fill="#1d469e" />
    </g>

    <!-- Классическая гжельская «агашка» с тонкой сеточкой и веером капелек (образец №1) -->
    <g id="gz-agashka">
      <path d="M-28,3 C-32,-14 -20,-30 -6,-30 C-13,-16 -13,0 -4,12 Z" fill="#1d469e" />
      <path d="M28,3 C32,-14 20,-30 6,-30 C13,-16 13,0 4,12 Z" fill="#1d469e" />
      <path d="M-16,-25 C-9,-36 9,-36 16,-25 C7,-30 -7,-30 -16,-25 Z" fill="#2e5fc2" />
      <path d="M-24,7 C-20,21 -7,30 0,30 C7,30 20,21 24,7 C15,16 7,19 0,19 C-7,19 -15,16 -24,7 Z" fill="#2e5fc2" />
      <path d="M-18,14 C-9,26 9,26 18,14 C9,18 -9,18 -18,14 Z" fill="#1d469e" />
      <!-- Тонкая ромбическая сеточка в чашечке -->
      <g stroke="#1d469e" stroke-width="1.2" stroke-linecap="round">
        <path d="M-11,-16 L11,6 M-4,-19 L13,-2 M-13,-7 L4,10" />
        <path d="M11,-16 L-11,6 M4,-19 L-13,-2 M13,-7 L-4,10" />
      </g>
      <!-- Веер тычинок-капелек -->
      <path d="M0,-32 C-2.2,-39 -1.2,-44 0,-46 C1.2,-44 2.2,-39 0,-32 Z" fill="#1d469e" />
      <path d="M-7,-29 C-12,-36 -14,-41 -13,-42 C-10,-41 -7,-36 -7,-29 Z" fill="#2e5fc2" />
      <path d="M7,-29 C12,-36 14,-41 13,-42 C10,-41 7,-36 7,-29 Z" fill="#2e5fc2" />
    </g>

    <!-- Резной плоский гжельский лист с белыми прожилками -->
    <g id="gz-leaf">
      <path mask="url(#gz-leaf-cut)" d="M0,0 C-10,-6 -14,-16 -8,-25 L-4,-23 L0,-33 L4,-23 L8,-25 C14,-16 10,-6 0,0 Z" fill="#2e5fc2" />
    </g>

    <!-- Розетка из 10 капелек (как на таблице «использование элемента капелька») -->
    <g id="gz-kapelka-rosette">
      <g fill="#1d469e">
        <path d="M0,-7 C-3,-13 -3.4,-20 0,-23 C3.4,-20 3,-13 0,-7 Z" />
        <path d="M0,-7 C-3,-13 -3.4,-20 0,-23 C3.4,-20 3,-13 0,-7 Z" transform="rotate(36)" />
        <path d="M0,-7 C-3,-13 -3.4,-20 0,-23 C3.4,-20 3,-13 0,-7 Z" transform="rotate(72)" />
        <path d="M0,-7 C-3,-13 -3.4,-20 0,-23 C3.4,-20 3,-13 0,-7 Z" transform="rotate(108)" />
        <path d="M0,-7 C-3,-13 -3.4,-20 0,-23 C3.4,-20 3,-13 0,-7 Z" transform="rotate(144)" />
        <path d="M0,-7 C-3,-13 -3.4,-20 0,-23 C3.4,-20 3,-13 0,-7 Z" transform="rotate(180)" />
        <path d="M0,-7 C-3,-13 -3.4,-20 0,-23 C3.4,-20 3,-13 0,-7 Z" transform="rotate(216)" />
        <path d="M0,-7 C-3,-13 -3.4,-20 0,-23 C3.4,-20 3,-13 0,-7 Z" transform="rotate(252)" />
        <path d="M0,-7 C-3,-13 -3.4,-20 0,-23 C3.4,-20 3,-13 0,-7 Z" transform="rotate(288)" />
        <path d="M0,-7 C-3,-13 -3.4,-20 0,-23 C3.4,-20 3,-13 0,-7 Z" transform="rotate(324)" />
      </g>
      <circle cx="0" cy="0" r="4.8" fill="none" stroke="#1d469e" stroke-width="1.4" />
      <circle cx="0" cy="0" r="1.8" fill="#2e5fc2" />
    </g>

    <!-- Каллиграфический завиток с веточкой капелек и точечным шлейфом -->
    <g id="gz-scroll-branch">
      <path d="M-28,16 C-20,-8 4,-22 22,-14 C33,-9 34,5 25,12 C17,18 6,14 6,5 C6,-2 13,-6 18,-2 C13,-1 11,4 13,7 C17,10 24,7 24,0 C22,-10 9,-15 -5,-5 C-16,3 -21,14 -28,16 Z" fill="#1d469e" />
      <path d="M-14,-4 C-20,-16 -12,-28 2,-30" fill="none" stroke="#1d469e" stroke-width="1.4" stroke-linecap="round" />
      <!-- Пары плоских капелек вдоль веточки -->
      <path d="M-16,-12 C-24,-15 -29,-20 -27,-21 C-24,-21 -19,-18 -16,-12 Z" fill="#2e5fc2" />
      <path d="M-11,-20 C-18,-26 -21,-32 -19,-33 C-16,-32 -12,-26 -11,-20 Z" fill="#2e5fc2" />
      <path d="M-3,-26 C-8,-33 -9,-38 -7,-39 C-5,-37 -3,-32 -3,-26 Z" fill="#1d469e" />
      <circle cx="7" cy="-30" r="1.9" fill="#1d469e" />
      <circle cx="14" cy="-27" r="1.6" fill="#2e5fc2" />
      <circle cx="20" cy="-22" r="1.3" fill="#2e5fc2" />
    </g>
  </defs>

  <!-- Непрерывные тонкие кобальтовые стебли-усики (бесшовные по 0/280) -->
  <g fill="none" stroke="#2e5fc2" stroke-width="1.3" stroke-linecap="round" opacity="0.72">
    <path d="M0,140 C56,92 98,188 140,140 C182,92 224,188 280,140" />
    <path d="M140,0 C92,56 188,98 140,140 C92,182 188,224 140,280" />
  </g>

  <!-- Резные гжельские листья вокруг центрального цветка -->
  <use href="#gz-leaf" transform="translate(106, 114) rotate(-52)" />
  <use href="#gz-leaf" transform="translate(174, 166) rotate(128)" />
  <use href="#gz-leaf" transform="translate(168, 108) rotate(44) scale(0.84)" />
  <use href="#gz-leaf" transform="translate(112, 172) rotate(-136) scale(0.84)" />

  <!-- Центральный большой цветок Гжели -->
  <use href="#gz-blossom" x="140" y="140" />

  <!-- Бесшовные угловые «агашки с сеточкой» -->
  <use href="#gz-agashka" x="0" y="0" />
  <use href="#gz-agashka" x="280" y="0" />
  <use href="#gz-agashka" x="0" y="280" />
  <use href="#gz-agashka" x="280" y="280" />

  <!-- Бесшовные розетки из капелек по серединам сторон -->
  <use href="#gz-kapelka-rosette" x="140" y="0" />
  <use href="#gz-kapelka-rosette" x="140" y="280" />
  <use href="#gz-kapelka-rosette" x="0" y="140" />
  <use href="#gz-kapelka-rosette" x="280" y="140" />

  <!-- Четыре каллиграфических завитка с веточками-капельками -->
  <use href="#gz-scroll-branch" x="66" y="68" />
  <use href="#gz-scroll-branch" transform="translate(214 66) scale(-1 1) rotate(10)" />
  <use href="#gz-scroll-branch" transform="translate(68 214) scale(1 -1) rotate(-10)" />
  <use href="#gz-scroll-branch" transform="translate(214 214) scale(-1 -1)" />

  <!-- Россыпь мелких точечек-бусин в паузах -->
  <g fill="#2e5fc2">
    <circle cx="96" cy="24" r="1.8" /><circle cx="104" cy="28" r="1.3" />
    <circle cx="184" cy="24" r="1.8" /><circle cx="176" cy="28" r="1.3" />
    <circle cx="96" cy="256" r="1.8" /><circle cx="104" cy="252" r="1.3" />
    <circle cx="184" cy="256" r="1.8" /><circle cx="176" cy="252" r="1.3" />
    <circle cx="24" cy="96" r="1.6" /><circle cx="256" cy="96" r="1.6" />
    <circle cx="24" cy="184" r="1.6" /><circle cx="256" cy="184" r="1.6" />
  </g>
</svg>
