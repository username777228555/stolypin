<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <defs>
    <!-- Плоская 2D ягода рябины с чашелистиком, ободком и золотой точкой -->
    <g id="kh-berry">
      <circle cx="0" cy="0" r="6.8" fill="#d92b1e" />
      <path d="M-2.2,-1.2 L0,0.5 L2.2,-1.2 M0,0.5 L0,-2.6" stroke="#0c0907" stroke-width="1.3" stroke-linecap="round" fill="none" />
      <path d="M-4,1.6 A4.4,4.4 0 0,0 -0.4,4.4" stroke="#f5cb52" stroke-width="1.35" stroke-linecap="round" fill="none" />
    </g>

    <!-- Классическая хохломская земляничка (клубничка) с золотыми зёрнышками и резной зелёной чашечкой -->
    <g id="kh-strawberry">
      <path d="M0,-14 C10,-14 14,-4 10,7 C7,15 3,19 0,20 C-3,19 -7,15 -10,7 C-14,-4 -10,-14 0,-14 Z" fill="#d92b1e" />
      <!-- Тонкая золотая кайма по одной стороне (традиционная «подцветка») -->
      <path d="M-8,-9 C-11,-1 -9,8 -3,16" fill="none" stroke="#f5cb52" stroke-width="1.6" stroke-linecap="round" />
      <!-- Золотые семена-точки в шахматном порядке -->
      <g fill="#f5cb52">
        <circle cx="-4.5" cy="-4" r="1.2" /><circle cx="1" cy="-5" r="1.2" /><circle cx="6" cy="-3" r="1.2" />
        <circle cx="-5.5" cy="2" r="1.2" /><circle cx="-0.5" cy="1.5" r="1.2" /><circle cx="5" cy="3" r="1.2" />
        <circle cx="-3" cy="8.5" r="1.15" /><circle cx="2.5" cy="9" r="1.15" />
        <circle cx="0" cy="14" r="1.1" />
      </g>
      <!-- Резная зелёно-золотая чашечка-корона -->
      <path d="M0,-12 L-10,-17 L-5,-11 L-12,-8 L-3,-9 L0,-19 L3,-9 L12,-8 L5,-11 L10,-17 Z" fill="#68a63c" stroke="#0c0907" stroke-width="0.9" stroke-linejoin="round" />
      <path d="M0,-18 L0,-25" stroke="#e6b338" stroke-width="1.8" stroke-linecap="round" />
    </g>

    <!-- Богатый тройной зубчатый лист хохломы с тонкой чёрной разживкой -->
    <g id="kh-leaf-big">
      <!-- Центральный большой зубчатый лист (половина зелёная, половина золотая — как у мастеров Семёнова) -->
      <path d="M0,0 C-9,-7 -14,-16 -10,-25 L-5,-22 L-7,-32 L-2,-28 L0,-39 L2,-28 L7,-32 L5,-22 L10,-25 C14,-16 9,-7 0,0 Z" fill="#68a63c" />
      <path d="M0,0 C9,-7 14,-16 10,-25 L5,-22 L7,-32 L2,-28 L0,-39 Z" fill="#e6b338" />
      <!-- Чёрная прорисовка прожилок («разживка») -->
      <path d="M0,0 L0,-34 M0,-9 L-7,-16 M0,-9 L7,-16 M0,-17 L-8,-23 M0,-17 L8,-23 M0,-25 L-5,-29 M0,-25 L5,-29" stroke="#0c0907" stroke-width="1.15" stroke-linecap="round" fill="none" />
      <!-- Два боковых малых зубчатых листка -->
      <g transform="translate(-3,-4) rotate(-48) scale(0.62)">
        <path d="M0,0 C-9,-7 -13,-16 -7,-25 L-2,-22 L0,-32 L2,-22 L7,-25 C13,-16 9,-7 0,0 Z" fill="#e6b338" />
        <path d="M0,0 L0,-27 M0,-9 L-6,-16 M0,-9 L6,-16" stroke="#0c0907" stroke-width="1.4" stroke-linecap="round" fill="none" />
      </g>
      <g transform="translate(3,-4) rotate(48) scale(0.62)">
        <path d="M0,0 C-9,-7 -13,-16 -7,-25 L-2,-22 L0,-32 L2,-22 L7,-25 C13,-16 9,-7 0,0 Z" fill="#68a63c" />
        <path d="M0,0 L0,-27 M0,-9 L-6,-16 M0,-9 L6,-16" stroke="#0c0907" stroke-width="1.4" stroke-linecap="round" fill="none" />
      </g>
    </g>

    <!-- Малый резной двойной лист -->
    <g id="kh-leaf-sm">
      <path d="M0,0 C-7,-5 -10,-13 -5,-20 L-2,-18 L0,-26 L2,-18 L5,-20 C10,-13 7,-5 0,0 Z" fill="#68a63c" />
      <path d="M0,-2 C4,-7 6,-13 3,-19 L0,-24 Z" fill="#e6b338" />
      <path d="M0,0 L0,-21 M0,-8 L-4.5,-13 M0,-8 L4.5,-13" stroke="#0c0907" stroke-width="1.1" stroke-linecap="round" fill="none" />
    </g>

    <!-- Жар-цветок (богатый 6-лепестковый хохломской цветок с золотыми фестонами и чёрной припиской) -->
    <g id="kh-fire-flower">
      <!-- Золотой внешний контур с волнистыми краями -->
      <g fill="#e6b338">
        <path d="M0,-7 C-12,-14 -16,-27 -8,-34 C-4,-37 -1,-35 0,-38 C1,-35 4,-37 8,-34 C16,-27 12,-14 0,-7 Z" />
        <path d="M0,-7 C-12,-14 -16,-27 -8,-34 C-4,-37 -1,-35 0,-38 C1,-35 4,-37 8,-34 C16,-27 12,-14 0,-7 Z" transform="rotate(60)" />
        <path d="M0,-7 C-12,-14 -16,-27 -8,-34 C-4,-37 -1,-35 0,-38 C1,-35 4,-37 8,-34 C16,-27 12,-14 0,-7 Z" transform="rotate(120)" />
        <path d="M0,-7 C-12,-14 -16,-27 -8,-34 C-4,-37 -1,-35 0,-38 C1,-35 4,-37 8,-34 C16,-27 12,-14 0,-7 Z" transform="rotate(180)" />
        <path d="M0,-7 C-12,-14 -16,-27 -8,-34 C-4,-37 -1,-35 0,-38 C1,-35 4,-37 8,-34 C16,-27 12,-14 0,-7 Z" transform="rotate(240)" />
        <path d="M0,-7 C-12,-14 -16,-27 -8,-34 C-4,-37 -1,-35 0,-38 C1,-35 4,-37 8,-34 C16,-27 12,-14 0,-7 Z" transform="rotate(300)" />
      </g>
      <!-- Внутренние алые лепестки -->
      <g fill="#d92b1e">
        <path d="M0,-7 C-9,-13 -11,-23 -5,-29 C-2,-31 2,-31 5,-29 C11,-23 9,-13 0,-7 Z" />
        <path d="M0,-7 C-9,-13 -11,-23 -5,-29 C-2,-31 2,-31 5,-29 C11,-23 9,-13 0,-7 Z" transform="rotate(60)" />
        <path d="M0,-7 C-9,-13 -11,-23 -5,-29 C-2,-31 2,-31 5,-29 C11,-23 9,-13 0,-7 Z" transform="rotate(120)" />
        <path d="M0,-7 C-9,-13 -11,-23 -5,-29 C-2,-31 2,-31 5,-29 C11,-23 9,-13 0,-7 Z" transform="rotate(180)" />
        <path d="M0,-7 C-9,-13 -11,-23 -5,-29 C-2,-31 2,-31 5,-29 C11,-23 9,-13 0,-7 Z" transform="rotate(240)" />
        <path d="M0,-7 C-9,-13 -11,-23 -5,-29 C-2,-31 2,-31 5,-29 C11,-23 9,-13 0,-7 Z" transform="rotate(300)" />
      </g>
      <!-- Тонкая чёрная веерная штриховка на каждом лепестке -->
      <g stroke="#0c0907" stroke-width="1.15" stroke-linecap="round" fill="none">
        <path d="M0,-10 L0,-22 M-3.5,-11 L-6,-19 M3.5,-11 L6,-19" />
        <path d="M0,-10 L0,-22 M-3.5,-11 L-6,-19 M3.5,-11 L6,-19" transform="rotate(60)" />
        <path d="M0,-10 L0,-22 M-3.5,-11 L-6,-19 M3.5,-11 L6,-19" transform="rotate(120)" />
        <path d="M0,-10 L0,-22 M-3.5,-11 L-6,-19 M3.5,-11 L6,-19" transform="rotate(180)" />
        <path d="M0,-10 L0,-22 M-3.5,-11 L-6,-19 M3.5,-11 L6,-19" transform="rotate(240)" />
        <path d="M0,-10 L0,-22 M-3.5,-11 L-6,-19 M3.5,-11 L6,-19" transform="rotate(300)" />
      </g>
      <!-- Сердцевина с золотыми тычинками -->
      <circle cx="0" cy="0" r="8" fill="#0c0907" />
      <circle cx="0" cy="0" r="5.2" fill="#f5cb52" />
      <circle cx="0" cy="0" r="2.4" fill="#d92b1e" />
      <g fill="#f5cb52">
        <circle cx="0" cy="-10.5" r="1.2" /><circle cx="9" cy="-5.2" r="1.2" /><circle cx="9" cy="5.2" r="1.2" />
        <circle cx="0" cy="10.5" r="1.2" /><circle cx="-9" cy="5.2" r="1.2" /><circle cx="-9" cy="-5.2" r="1.2" />
      </g>
    </g>

    <!-- Малый золотой 5-лепестковый цветочек с красной серединкой -->
    <g id="kh-gold-blossom">
      <g fill="#f5cb52">
        <path d="M0,-3 C-5,-7 -6,-14 -2,-16 C-1,-16.5 1,-16.5 2,-16 C6,-14 5,-7 0,-3 Z" />
        <path d="M0,-3 C-5,-7 -6,-14 -2,-16 C-1,-16.5 1,-16.5 2,-16 C6,-14 5,-7 0,-3 Z" transform="rotate(72)" />
        <path d="M0,-3 C-5,-7 -6,-14 -2,-16 C-1,-16.5 1,-16.5 2,-16 C6,-14 5,-7 0,-3 Z" transform="rotate(144)" />
        <path d="M0,-3 C-5,-7 -6,-14 -2,-16 C-1,-16.5 1,-16.5 2,-16 C6,-14 5,-7 0,-3 Z" transform="rotate(216)" />
        <path d="M0,-3 C-5,-7 -6,-14 -2,-16 C-1,-16.5 1,-16.5 2,-16 C6,-14 5,-7 0,-3 Z" transform="rotate(288)" />
      </g>
      <g stroke="#0c0907" stroke-width="0.9" stroke-linecap="round">
        <path d="M0,-5 L0,-11 M5,-1.5 L10,-3.5 M3,4 L6.5,8.5 M-3,4 L-6.5,8.5 M-5,-1.5 L-10,-3.5" />
      </g>
      <circle cx="0" cy="0" r="4.2" fill="#d92b1e" />
      <circle cx="0" cy="0" r="1.6" fill="#0c0907" />
    </g>

    <!-- Пышная 11-ягодная гроздь рябины -->
    <g id="kh-rowan-rich">
      <path d="M0,-22 L0,-6 M0,-14 L-12,-6 M0,-14 L12,-6 M-8,-2 L-16,10 M8,-2 L16,10 M0,2 L0,20" stroke="#e6b338" stroke-width="1.6" stroke-linecap="round" />
      <use href="#kh-berry" x="-14" y="-8" />
      <use href="#kh-berry" x="0" y="-13" />
      <use href="#kh-berry" x="14" y="-7" />
      <use href="#kh-berry" x="-20" y="5" transform="scale(0.9)" />
      <use href="#kh-berry" x="-7" y="2" />
      <use href="#kh-berry" x="7" y="3" />
      <use href="#kh-berry" x="20" y="6" transform="scale(0.9)" />
      <use href="#kh-berry" x="-13" y="15" transform="scale(0.92)" />
      <use href="#kh-berry" x="0" y="14" />
      <use href="#kh-berry" x="13" y="16" transform="scale(0.9)" />
      <use href="#kh-berry" x="1" y="26" transform="scale(0.84)" />
    </g>

    <!-- Веер стремительных осочек и золотая спираль-кудрина -->
    <g id="kh-kudrina-fan">
      <path d="M-26,18 C-14,-2 4,-14 26,-16 C8,-9 -6,4 -16,24 Z" fill="#e6b338" />
      <path d="M-16,24 C-2,10 14,2 30,4 C14,8 0,16 -8,28 Z" fill="#68a63c" />
      <path d="M-6,26 C6,18 18,16 28,22 C16,20 6,22 -2,30 Z" fill="#e6b338" />
      <!-- Спираль-кудрина -->
      <path d="M-22,8 C-28,-8 -16,-24 -2,-20 C10,-17 12,-5 5,0 C-1,4 -9,0 -7,-7 C-5,-12 1,-12 3,-8" fill="none" stroke="#e6b338" stroke-width="2" stroke-linecap="round" />
      <!-- Цепочка ягод вдоль завитка -->
      <circle cx="-22" cy="-12" r="2.8" fill="#d92b1e" />
      <circle cx="-13" cy="-23" r="2.5" fill="#d92b1e" />
      <circle cx="-2" cy="-26" r="2.2" fill="#d92b1e" />
      <circle cx="8" cy="-24" r="1.9" fill="#f5cb52" />
      <circle cx="17" cy="-18" r="1.6" fill="#f5cb52" />
    </g>
  </defs>

  <!-- НЕПРЕРЫВНЫЕ БЕСШОВНЫЕ ЗОЛОТЫЕ И ЗЕЛЁНЫЕ СТЕБЛИ (C¹-гладкие стыки через все 4 границы 0/300!) -->
  <g fill="none" stroke-linecap="round">
    <!-- Главная горизонтальная волна-лоза (вход/выход y=150 с одинаковым наклоном) -->
    <path d="M0,150 C60,96 105,204 150,150 C195,96 240,204 300,150" stroke="#e6b338" stroke-width="2.6" />
    <!-- Главная вертикальная волна-лоза (вход/выход x=150 с одинаковым наклоном) -->
    <path d="M150,0 C96,60 204,105 150,150 C96,195 204,240 150,300" stroke="#e6b338" stroke-width="2.4" />
    <!-- Вторичные переплетающиеся зелёно-золотые побеги через углы и стороны -->
    <path d="M0,64 C48,44 96,84 150,64 C204,44 252,84 300,64" stroke="#68a63c" stroke-width="1.6" opacity="0.88" />
    <path d="M0,236 C48,216 96,256 150,236 C204,216 252,256 300,236" stroke="#68a63c" stroke-width="1.6" opacity="0.88" />
    <path d="M64,0 C44,48 84,96 64,150 C44,204 84,252 64,300" stroke="#e6b338" stroke-width="1.4" opacity="0.72" />
    <path d="M236,0 C216,48 256,96 236,150 C216,204 256,252 236,300" stroke="#e6b338" stroke-width="1.4" opacity="0.72" />
  </g>

  <!-- ЧЕТЫРЕ ДИАГОНАЛЬНЫЕ КОМПОЗИЦИИ: ОСОЧКИ, КУДРИНЫ, ЗЕМЛЯНИЧКИ И БОЛЬШИЕ ЗУБЧАТЫЕ ЛИСТЬЯ -->
  <use href="#kh-kudrina-fan" transform="translate(76, 74) rotate(-8)" />
  <use href="#kh-kudrina-fan" transform="translate(226, 226) rotate(172)" />

  <!-- Две нарядные хохломские землянички в противоположных квадрантах -->
  <use href="#kh-leaf-big" transform="translate(216, 86) rotate(36)" />
  <use href="#kh-strawberry" transform="translate(232, 68) rotate(22)" />
  <use href="#kh-leaf-sm" transform="translate(254, 96) rotate(72)" />

  <use href="#kh-leaf-big" transform="translate(84, 214) rotate(-144)" />
  <use href="#kh-strawberry" transform="translate(68, 232) rotate(-158)" />
  <use href="#kh-leaf-sm" transform="translate(46, 204) rotate(-108)" />

  <!-- Дополнительные зубчатые листья вдоль главной лозы -->
  <use href="#kh-leaf-big" transform="translate(120, 128) rotate(-42) scale(0.92)" />
  <use href="#kh-leaf-big" transform="translate(182, 174) rotate(138) scale(0.92)" />
  <use href="#kh-leaf-sm" transform="translate(114, 186) rotate(-122)" />
  <use href="#kh-leaf-sm" transform="translate(188, 114) rotate(58)" />

  <!-- ЦЕНТРАЛЬНАЯ БОГАТАЯ ГРОЗДЬ РЯБИНЫ -->
  <use href="#kh-rowan-rich" x="150" y="150" />

  <!-- БЕСШОВНЫЕ УГЛОВЫЕ ЖАР-ЦВЕТЫ (повторены на всех 4 углах 0/300) -->
  <use href="#kh-fire-flower" x="0" y="0" />
  <use href="#kh-fire-flower" x="300" y="0" />
  <use href="#kh-fire-flower" x="0" y="300" />
  <use href="#kh-fire-flower" x="300" y="300" />

  <!-- БЕСШОВНЫЕ ЗОЛОТЫЕ ЦВЕТОЧКИ И ЛИСТЬЯ ПО СЕРЕДИНАМ СТОРОН -->
  <use href="#kh-leaf-sm" transform="translate(132, 18) rotate(-52)" />
  <use href="#kh-leaf-sm" transform="translate(168, 18) rotate(52)" />
  <use href="#kh-leaf-sm" transform="translate(132, 282) rotate(-128)" />
  <use href="#kh-leaf-sm" transform="translate(168, 282) rotate(128)" />

  <use href="#kh-gold-blossom" x="150" y="0" />
  <use href="#kh-gold-blossom" x="150" y="300" />
  <use href="#kh-gold-blossom" x="0" y="150" />
  <use href="#kh-gold-blossom" x="300" y="150" />

  <!-- Вторичные малые цветочки и алые ягодки-цепочки в паузах (никаких «дыр»!) -->
  <use href="#kh-gold-blossom" transform="translate(76, 150) scale(0.76)" />
  <use href="#kh-gold-blossom" transform="translate(224, 150) scale(0.76)" />
  <use href="#kh-gold-blossom" transform="translate(150, 72) scale(0.74)" />
  <use href="#kh-gold-blossom" transform="translate(150, 228) scale(0.74)" />

  <!-- Тонкие веточки с золотыми и алыми бусинами -->
  <g fill="#d92b1e">
    <circle cx="38" cy="112" r="2.8" /><circle cx="46" cy="106" r="2.2" />
    <circle cx="262" cy="188" r="2.8" /><circle cx="254" cy="194" r="2.2" />
    <circle cx="112" cy="38" r="2.6" /><circle cx="188" cy="262" r="2.6" />
    <circle cx="194" cy="36" r="2.4" /><circle cx="106" cy="264" r="2.4" />
  </g>
  <g fill="#f5cb52">
    <circle cx="52" cy="100" r="1.6" /><circle cx="248" cy="200" r="1.6" />
    <circle cx="104" cy="46" r="1.6" /><circle cx="196" cy="254" r="1.6" />
    <circle cx="32" cy="186" r="1.8" /><circle cx="268" cy="114" r="1.8" />
    <circle cx="118" cy="110" r="1.6" /><circle cx="182" cy="190" r="1.6" />
  </g>
</svg>
